name: "Security: CodeQL Analysis"
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Analyzes the shipped code (src/ and the analyzers built into it), not the tests: only changes to those, or to
# the shared build files, start it on a push or PR; the weekly schedule covers everything else.
on:
  push:
    branches: ["master"]
    paths:
      - "src/**"
      - "analyzers/**"
      - "*.props"
      - "*.targets"
      - "global.json"
      - ".github/workflows/_codeql.yml"
  pull_request:
    branches: ["master"]
    paths:
      - "src/**"
      - "analyzers/**"
      - "*.props"
      - "*.targets"
      - "global.json"
      - ".github/workflows/_codeql.yml"
  schedule:
    - cron: "44 13 * * 2" # Every Tuesday at 13:44 UTC

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # CodeQL: manual build mode for C#
  # ---------------------------------------------------------------------------
  analyze:
    name: "Analyze: C# (CodeQL)"
    # Skipped when the pull request is labelled as documentation-only.
    if: github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'documentation')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.39.3
        with:
          languages: csharp
          build-mode: manual

      - name: Restore & build source
        run: |
          dotnet restore src/Nalix.sln
          dotnet build src/Nalix.sln \
            --configuration Release \
            --no-restore \
            /p:UseSharedCompilation=false

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4.39.3
        with:
          category: "/language:csharp"
