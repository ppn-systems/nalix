name: "Publish: NuGet"
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (without v prefix, e.g., 1.0.0)'
        required: true

permissions:
  contents: read
  packages: write
jobs:
  publish:
    name: "Publish NuGet (tag only)"
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Extract version
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
          else
            version="${GITHUB_REF#refs/tags/v}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version '$version' (expected SemVer, e.g. 1.2.3 or 1.2.3-rc.1)"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore ./tests/Nalix.Tests.sln

      # Never ship a package whose tests are red. The test build must stay unsigned: a strong-name-signed assembly
      # cannot grant InternalsVisibleTo by simple name, so the signing key is decoded only after this step.
      - name: Test
        timeout-minutes: 20
        run: dotnet test ./tests/Nalix.Tests.sln --configuration Release --no-restore --blame-hang --blame-hang-timeout 120000

      - name: Decode signing key
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: echo "$SIGNING_KEY" | base64 -d > ./src/Nalix.snk

      # Rebuild everything from scratch so the packed assemblies are the signed, version-stamped ones.
      - name: Build
        run: dotnet build ./src/Nalix.sln --configuration Release --no-restore --no-incremental /p:Version=${{ env.VERSION }}

      - name: Pack
        run: dotnet pack ./src/Nalix.sln --configuration Release --no-build --output ./out /p:Version=${{ env.VERSION }}

      - name: Verify package exists
        shell: bash
        run: |
          count=$(ls ./out/*.nupkg 2>/dev/null | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "❌ No .nupkg files found in ./out" && exit 1
          fi
          echo "✅ Found $count package(s):"
          ls ./out/*.nupkg

      # -----------------------------------------------------------------------
      # Push to NuGet.org
      # -----------------------------------------------------------------------
      - name: Push to NuGet.org
        run: |
          dotnet nuget push ./out/*.nupkg \
            --api-key "${{ secrets.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      # -----------------------------------------------------------------------
      # Push to GitHub Packages
      # -----------------------------------------------------------------------
      - name: Push to GitHub Packages
        run: |
          dotnet nuget push ./out/*.nupkg \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --skip-duplicate
