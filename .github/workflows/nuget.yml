name: "Publish: NuGet"
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (without v prefix, e.g., 1.0.0)'
        required: true

permissions:
  contents: read

jobs:
  # Test, build and pack. Holds no publishing credentials.
  pack:
    name: "Test & Pack"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          # net10.0 and net11.0 are both built: the .NET 11 SDK builds both, the .NET 10 runtime runs the net10.0 tests.
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Extract version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
          else
            version="${GITHUB_REF#refs/tags/v}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version '$version' (expected SemVer, e.g. 1.2.3 or 1.2.3-rc.1)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore ./tests/Nalix.Tests.sln

      # Never ship a package whose tests are red. The test build must stay unsigned: a strong-name-signed assembly
      # cannot grant InternalsVisibleTo by simple name, so the signing key is decoded only after this step.
      - name: Test
        timeout-minutes: 20
        run: dotnet test ./tests/Nalix.Tests.sln --configuration Release --no-restore --blame-hang --blame-hang-timeout 120000

      - name: Decode signing key
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: echo "$SIGNING_KEY" | base64 -d > ./src/Nalix.snk

      # Rebuild everything from scratch so the packed assemblies are the signed, version-stamped ones.
      # NalixInternalsVisibleTo=false keeps the test/benchmark assembly names out of the shipped assemblies.
      - name: Build
        run: dotnet build ./src/Nalix.sln --configuration Release --no-restore --no-incremental /p:Version=${{ steps.version.outputs.version }} /p:NalixInternalsVisibleTo=false

      - name: Pack
        run: dotnet pack ./src/Nalix.sln --configuration Release --no-build --output ./out /p:Version=${{ steps.version.outputs.version }}

      - name: Remove signing key
        if: always()
        run: rm -f ./src/Nalix.snk

      - name: Verify package exists
        shell: bash
        run: |
          count=$(ls ./out/*.nupkg 2>/dev/null | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::No .nupkg files found in ./out" && exit 1
          fi
          echo "Found $count package(s):"
          ls ./out/*.nupkg ./out/*.snupkg 2>/dev/null

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: |
            ./out/*.nupkg
            ./out/*.snupkg
          if-no-files-found: error
          retention-days: 7

  # Publish only. Runs in the 'production' environment, which the nuget.org trusted publishing policy is bound to
  # (owner ppn-systems, repository nalix, workflow nuget.yml, environment production).
  publish:
    name: "Publish"
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write   # OIDC token exchanged for a short-lived nuget.org API key (trusted publishing)
      packages: write   # GitHub Packages push with GITHUB_TOKEN

    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: ./out

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Requested right before the push: the temporary key is valid for one hour and each OIDC token mints one key.
      - name: NuGet login (OIDC to temporary API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: phcnguyen   # nuget.org profile name of the policy owner (not an email address)

      # Pushing the .nupkg also pushes the matching .snupkg next to it.
      - name: Push to NuGet.org
        run: |
          dotnet nuget push ./out/*.nupkg \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push ./out/*.nupkg \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --skip-duplicate \
            --no-symbols
