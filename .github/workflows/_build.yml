name: "Template: Build & Test"
# Force use of Node 24 for all actions due to Node 20 deprecation
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOTNET_CLI_USE_MSBUILD_SERVER: false
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_XMLDOC_MODE: skip

permissions:
  contents: read
  checks: write
  pull-requests: write

on:
  workflow_call:
    inputs:
      os:
        description: "Target OS (ubuntu-latest | windows-latest)"
        required: true
        type: string
      project:
        description: "Path(s) to .csproj or .sln files, one per line"
        required: true
        type: string
      test:
        description: "Path(s) to test .csproj or .sln files, one per line"
        required: false
        type: string
        default: ""
      deploy:
        description: "Set true to publish and upload build output"
        required: false
        type: boolean
        default: false
      coverage:
        description: "Set true to collect and publish coverage"
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: "Build & Test (${{ inputs.os }})"
    runs-on: ${{ inputs.os }}
    # Concurrency lives in the caller: a job-level group here made matrix callers on the same OS cancel each other.
    timeout-minutes: 30

    steps:
      - name: Set environment variables
        shell: bash
        run: |
          echo "TEST_RESULTS_DIR=artifacts/test-results/${{ runner.os }}" >> "$GITHUB_ENV"
          echo "COVERAGE_REPORT_DIR=artifacts/coverage/${{ runner.os }}" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Decode signing key
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "$SIGNING_KEY" | base64 -d > "$GITHUB_WORKSPACE/src/Nalix.snk"
          else
            echo "SIGNING_KEY is not set. Skipping signing key creation."
          fi

      - name: Restore main project
        if: ${{ inputs.test == '' || inputs.deploy }}
        shell: bash
        run: dotnet restore "${{ inputs.project }}"

      - name: Restore test projects
        if: ${{ inputs.test != '' }}
        shell: bash
        run: dotnet restore "${{ inputs.test }}"

      - name: Build source projects
        if: ${{ inputs.test == '' || inputs.deploy }}
        shell: bash
        timeout-minutes: 15
        run: dotnet build "${{ inputs.project }}" -c Release --no-restore -m

      - name: Build test projects
        if: ${{ inputs.test != '' }}
        shell: bash
        timeout-minutes: 15
        run: dotnet build "${{ inputs.test }}" -c Release --no-restore -m

      - name: Run all tests
        if: ${{ inputs.test != '' }}
        shell: bash
        timeout-minutes: 20
        run: |
          max_retries=2
          attempt=1
          while true; do
            # Clean results directory to avoid mixing failed and successful runs
            rm -rf "$TEST_RESULTS_DIR"/* 2>/dev/null || true

            echo "Running tests (Attempt $attempt/$max_retries)..."
            test_args=(
              "${{ inputs.test }}"
              --configuration Release
              --no-build
              --no-restore
              --logger "trx"
              --results-directory "$TEST_RESULTS_DIR"
              --blame-hang
              --blame-hang-timeout 120000
              -m
            )

            if [ "${{ inputs.coverage }}" = "true" ]; then
              test_args+=(--collect:"XPlat Code Coverage")
            fi

            if dotnet test "${test_args[@]}"; then
              echo "Tests passed!"
              break
            fi

            exit_code=$?
            if [ $attempt -ge $max_retries ]; then
              echo "Tests failed after $max_retries attempts."
              exit $exit_code
            fi

            echo "Test run failed (exit code $exit_code). Retrying in 10 seconds..."
            attempt=$((attempt+1))
            sleep 10
          done

      - name: Detect coverage reports
        id: coverage_files
        if: ${{ inputs.coverage && inputs.test != '' }}
        shell: bash
        run: |
          if [ -d "$TEST_RESULTS_DIR" ] && find "$TEST_RESULTS_DIR" -name 'coverage.cobertura.xml' -print -quit | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate coverage report
        if: always() && steps.coverage_files.outputs.found == 'true'
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: ${{ env.TEST_RESULTS_DIR }}/**/coverage.cobertura.xml
          targetdir: ${{ env.COVERAGE_REPORT_DIR }}
          reporttypes: Cobertura;MarkdownSummaryGithub

      - name: Publish coverage summary
        if: always() && steps.coverage_files.outputs.found == 'true'
        shell: bash
        run: cat "${COVERAGE_REPORT_DIR}/SummaryGithub.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage to Codecov
        if: always() && steps.coverage_files.outputs.found == 'true'
        uses: codecov/codecov-action@v7
        with:
          files: ${{ env.TEST_RESULTS_DIR }}/**/coverage.cobertura.xml
          flags: ${{ runner.os }}
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results
        if: ${{ inputs.test != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ runner.os }}
          path: ${{ github.workspace }}/${{ env.TEST_RESULTS_DIR }}
          if-no-files-found: warn
          compression-level: 0

      - name: Upload coverage report
        if: always() && steps.coverage_files.outputs.found == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ runner.os }}
          path: ${{ github.workspace }}/${{ env.COVERAGE_REPORT_DIR }}
          if-no-files-found: warn
          compression-level: 0

      - name: Publish build output
        if: inputs.deploy
        shell: bash
        run: dotnet publish "${{ inputs.project }}" --configuration Release --no-restore --no-build --output ./publish

      - name: Upload publish artifact
        if: inputs.deploy
        uses: actions/upload-artifact@v7
        with:
          name: publish-${{ runner.os }}
          path: ${{ github.workspace }}/publish
          if-no-files-found: warn
          compression-level: 0
