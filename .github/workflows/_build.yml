name: "Template: Build & Test"
# Force use of Node 24 for all actions due to Node 20 deprecation
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOTNET_CLI_USE_MSBUILD_SERVER: false
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_XMLDOC_MODE: skip

permissions:
  contents: read
  checks: write
  pull-requests: write

on:
  workflow_call:
    inputs:
      os:
        description: "Target OS (ubuntu-latest | windows-latest)"
        required: true
        type: string
      project:
        description: "Path(s) to .csproj or .sln files, one per line"
        required: true
        type: string
      test:
        description: "Path(s) to test .csproj or .sln files, one per line"
        required: false
        type: string
        default: ""
      deploy:
        description: "Set true to publish and upload build output"
        required: false
        type: boolean
        default: false
      coverage:
        description: "Set true to collect and publish coverage"
        required: false
        type: boolean
        default: false
      configuration:
        description: "Build configuration (Release | Debug)"
        required: false
        type: string
        default: "Release"

jobs:
  build:
    name: "Build & Test (${{ inputs.os }}, ${{ inputs.configuration }})"
    runs-on: ${{ inputs.os }}
    # Concurrency lives in the caller: a job-level group here made matrix callers on the same OS cancel each other.
    timeout-minutes: 30

    steps:
      - name: Set environment variables
        shell: bash
        run: |
          echo "TEST_RESULTS_DIR=artifacts/test-results/${{ runner.os }}-${{ inputs.configuration }}" >> "$GITHUB_ENV"
          echo "COVERAGE_REPORT_DIR=artifacts/coverage/${{ runner.os }}-${{ inputs.configuration }}" >> "$GITHUB_ENV"

      # Real-time scanning of every obj/bin write is the main reason Windows builds lag Linux.
      # Ephemeral GitHub-hosted runner only; the VM is discarded after the job.
      - name: Disable Windows Defender real-time scanning
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          # net10.0 and net11.0 are both built: the .NET 11 SDK builds both, the .NET 10 runtime runs the net10.0 tests.
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore main project
        if: ${{ inputs.test == '' || inputs.deploy }}
        shell: bash
        run: dotnet restore "${{ inputs.project }}"

      - name: Restore test projects
        if: ${{ inputs.test != '' }}
        shell: bash
        run: dotnet restore "${{ inputs.test }}"

      - name: Build source projects
        if: ${{ inputs.test == '' || inputs.deploy }}
        shell: bash
        timeout-minutes: 15
        run: dotnet build "${{ inputs.project }}" -c "${{ inputs.configuration }}" --no-restore -m

      - name: Build test projects
        if: ${{ inputs.test != '' }}
        shell: bash
        timeout-minutes: 15
        run: dotnet build "${{ inputs.test }}" -c "${{ inputs.configuration }}" --no-restore -m

      - name: Run all tests
        if: ${{ inputs.test != '' }}
        shell: bash
        timeout-minutes: 20
        run: |
          rm -rf "$TEST_RESULTS_DIR"/* 2>/dev/null || true

          test_args=(
            "${{ inputs.test }}"
            --configuration "${{ inputs.configuration }}"
            --no-build
            --no-restore
            --logger "trx"
            --results-directory "$TEST_RESULTS_DIR"
            --blame-hang
            --blame-hang-timeout 120000
            -m
          )

          # Microsoft.CodeCoverage instead of coverlet: coverlet's instrumentation made Nalix.Codec.Tests take
          # ~4 min instead of ~30 s (its crypto loops), and that one project set the length of the whole job.
          if [ "${{ inputs.coverage }}" = "true" ]; then
            test_args+=(--settings tests/coverage.runsettings --collect "Code Coverage")
          fi

          # Capture the real exit code: `$?` after an `if` block is the if's status (0).
          exit_code=0
          dotnet test "${test_args[@]}" || exit_code=$?
          if [ $exit_code -eq 0 ]; then
            exit 0
          fi

          # One retry, of the failed tests only (not the whole suite, which doubled the job). Each failure that
          # passes on the retry is listed in the job summary so flaky tests stay visible.
          filter=$(python3 .github/scripts/failed-tests-filter.py "$TEST_RESULTS_DIR")
          if [ -z "$filter" ]; then
            echo "::error::dotnet test failed (exit code $exit_code) without a failed test in the results (build or crash)."
            exit $exit_code
          fi

          retry_args=(
            "${{ inputs.test }}"
            --configuration "${{ inputs.configuration }}"
            --no-build
            --no-restore
            --logger "trx"
            --results-directory "$TEST_RESULTS_DIR/retry"
            --blame-hang
            --blame-hang-timeout 120000
            -m
          )
          if [ "$filter" = "ALL" ]; then
            echo "Too many failures to filter: retrying the whole suite."
          else
            echo "Retrying the failed tests only: $filter"
            retry_args+=(--filter "$filter")
          fi

          retry_code=0
          dotnet test "${retry_args[@]}" || retry_code=$?
          if [ $retry_code -ne 0 ]; then
            echo "Tests failed again on the retry."
            exit $retry_code
          fi

          {
            echo "### Flaky tests (failed, then passed on the retry)"
            echo
            echo "$filter" | tr '|' '\n' | sed 's/^FullyQualifiedName=/- `/; s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::Some tests failed and then passed on the retry; see the job summary."

      - name: Detect coverage reports
        id: coverage_files
        if: ${{ inputs.coverage && inputs.test != '' }}
        shell: bash
        run: |
          if [ -d "$TEST_RESULTS_DIR" ] && find "$TEST_RESULTS_DIR" -name '*.cobertura.xml' -print -quit | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate coverage report
        if: always() && steps.coverage_files.outputs.found == 'true'
        uses: danielpalme/ReportGenerator-GitHub-Action@v5.6.0
        with:
          reports: ${{ env.TEST_RESULTS_DIR }}/**/*.cobertura.xml
          targetdir: ${{ env.COVERAGE_REPORT_DIR }}
          reporttypes: Cobertura;MarkdownSummaryGithub

      - name: Publish coverage summary
        if: always() && steps.coverage_files.outputs.found == 'true'
        shell: bash
        run: cat "${COVERAGE_REPORT_DIR}/SummaryGithub.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage to Codecov
        if: always() && steps.coverage_files.outputs.found == 'true'
        uses: codecov/codecov-action@v7
        with:
          files: ${{ env.TEST_RESULTS_DIR }}/**/*.cobertura.xml
          flags: ${{ runner.os }}-${{ inputs.configuration }}
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results
        if: ${{ inputs.test != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ runner.os }}-${{ inputs.configuration }}
          path: ${{ github.workspace }}/${{ env.TEST_RESULTS_DIR }}
          if-no-files-found: warn
          compression-level: 0

      - name: Upload coverage report
        if: always() && steps.coverage_files.outputs.found == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ runner.os }}-${{ inputs.configuration }}
          path: ${{ github.workspace }}/${{ env.COVERAGE_REPORT_DIR }}
          if-no-files-found: warn
          compression-level: 0

      - name: Publish build output
        if: inputs.deploy
        shell: bash
        run: dotnet publish "${{ inputs.project }}" --configuration "${{ inputs.configuration }}" --no-restore --no-build --output ./publish

      - name: Upload publish artifact
        if: inputs.deploy
        uses: actions/upload-artifact@v7
        with:
          name: publish-${{ runner.os }}-${{ inputs.configuration }}
          path: ${{ github.workspace }}/publish
          if-no-files-found: warn
          compression-level: 0
