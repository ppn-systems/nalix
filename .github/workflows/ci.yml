name: "CI"
# Single entry point for build & test. Only `CI OK` should be marked as a required status check.
#
# `plan` (.github/scripts/ci_plan.py) splits the work into shards and gives each one a key: a hash of every
# tracked file that can change its result, following the ProjectReference graph. A shard that passes saves a
# marker under its key, and a later run skips a shard whose marker already exists (saved from master or from the
# same pull request). So a run only pays for what the change can affect; a docs-only change skips everything.
# "Run workflow" (workflow_dispatch) ignores the markers and runs every shard.
#
# The shards that remain run in parallel, one runner each:
#   test   builds its test projects and what they reference for net10.0 only, without analyzers, and runs them;
#   build  compiles src and the extensions for every target framework with analyzers on (net11.0 breaks,
#          analyzer errors and public API changes are caught here, off the tests' critical path);
#   lint   actionlint over the workflows.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOTNET_CLI_USE_MSBUILD_SERVER: false
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_XMLDOC_MODE: skip
  # MSBuild reads environment variables as properties, so every dotnet restore/build/test below follows these.
  # Directory.Build.targets narrows the test projects' TargetFrameworks to this one.
  TestTargetFramework: net10.0
  # A project built through a ProjectReference from a solution keeps the solution's configuration (Release)
  # instead of falling back to its own default (Debug).
  ShouldUnsetParentConfigurationAndPlatform: false

# No paths-ignore: `plan` skips what a change cannot affect, and `CI OK` must report on every pull request.
on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

# A pull request run is superseded by the next push. A master run verifies a merged commit and must finish: the
# commit is part of its group, because runs that share a group cancel the older pending one when a newer arrives.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'latest' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # list the pass markers (Actions caches)
    outputs:
      tests: ${{ steps.plan.outputs.tests }}
      build: ${{ steps.plan.outputs.build }}
      build_key: ${{ steps.plan.outputs.build_key }}
      lint: ${{ steps.plan.outputs.lint }}
      lint_key: ${{ steps.plan.outputs.lint_key }}
    steps:
      - uses: actions/checkout@v7

      - name: Decide which shards must run
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CI_FORCE: ${{ github.event_name == 'workflow_dispatch' }}
          # A pull request from a fork may only skip what master has verified, never what its own runs marked.
          CI_TRUST_OWN_REF: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: python3 .github/scripts/ci_plan.py plan

  test:
    name: Test (${{ matrix.name }})
    needs: [plan]
    if: needs.plan.outputs.tests != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.tests) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      # The build job runs the analyzers; here they would only slow the compile down. Source generators still run.
      RunAnalyzers: false
      DisableNalixAnalyzers: true
      RESULTS_DIR: artifacts/test-results
    steps:
      # Real-time scanning of every obj/bin write is the main reason Windows builds lag Linux.
      # Ephemeral GitHub-hosted runner only; the VM is discarded after the job.
      - name: Disable Windows Defender real-time scanning
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          # The .NET 11 SDK restores the net11.0 target of the referenced projects; the tests run on .NET 10.
          dotnet-version: |
            10.0.x
            11.0.x

      # Only the shard's test projects: what they reference is built through ProjectReference, for net10.0 only.
      - name: Write the shard solution
        shell: bash
        env:
          SOLUTION: ${{ matrix.solution }}
        run: printf '%s' "$SOLUTION" > ci-shard.slnx

      # No NuGet cache: a cold restore takes ~10 s, less than downloading and unpacking the cache did.
      - name: Restore
        shell: bash
        run: dotnet restore ci-shard.slnx

      - name: Build
        shell: bash
        run: dotnet build ci-shard.slnx -c Release --no-restore -m

      - name: Test
        shell: bash
        run: bash .github/scripts/run-tests.sh ci-shard.slnx "$RESULTS_DIR" "${{ matrix.coverage }}"

      # One flag per shard: codecov.yml carries a flag forward from the parent commit when its shard was skipped.
      - name: List coverage reports
        id: coverage
        if: matrix.coverage
        shell: bash
        run: echo "files=$(find "$RESULTS_DIR" -name '*.cobertura.xml' | paste -sd, -)" >> "$GITHUB_OUTPUT"

      - name: Upload coverage to Codecov
        if: matrix.coverage && steps.coverage.outputs.files != ''
        uses: codecov/codecov-action@v7
        with:
          files: ${{ steps.coverage.outputs.files }}
          disable_search: true
          flags: ${{ matrix.name }}
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.name }}
          path: ${{ env.RESULTS_DIR }}
          if-no-files-found: ignore
          retention-days: 7

      - name: Write the pass marker
        shell: bash
        run: echo passed > ci-pass.txt

      - name: Save the pass marker
        uses: actions/cache/save@v6
        with:
          path: ci-pass.txt
          key: ${{ matrix.key }}

  build:
    name: Build (all targets, analyzers)
    needs: [plan]
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      # The real solutions, so a project missing from one is caught here and not at release time.
      - name: Build src and extensions
        shell: bash
        run: |
          set -euo pipefail
          for solution in src/Nalix.sln extensions/*.sln; do
            dotnet build "$solution" -c Release -m
          done

      - name: Write the pass marker
        shell: bash
        run: echo passed > ci-pass.txt

      - name: Save the pass marker
        uses: actions/cache/save@v6
        with:
          path: ci-pass.txt
          key: ${{ needs.plan.outputs.build_key }}

  lint:
    name: Lint workflows
    needs: [plan]
    if: needs.plan.outputs.lint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Run actionlint
        shell: bash
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color -shellcheck=

      - name: Write the pass marker
        shell: bash
        run: echo passed > ci-pass.txt

      - name: Save the pass marker
        uses: actions/cache/save@v6
        with:
          path: ci-pass.txt
          key: ${{ needs.plan.outputs.lint_key }}

  ci-ok:
    name: CI OK
    needs: [plan, test, build, lint]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check all jobs succeeded or were skipped
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "::error::A required job did not succeed ($r)."
              exit 1
            fi
          done
          echo "All jobs succeeded or were skipped."
